# MADFAM ecosystem OIDC auto-provision registry
# Consumed by: enclii secrets provision oidc
# Last Updated: 2026-06-16
#
# Operator flow (single Janua SSO session as admin@madfam.io):
#   export ENCLII_API_ENDPOINT=https://api.enclii.dev
#   enclii login
#   enclii secrets provision oidc --platform dhanam

issuer: https://auth.madfam.io

platforms:
  dhanam:
    intake_target: dhanam/oidc-janua
    session_intake_target: dhanam/session-auth
    janua_client:
      name: Dhanam
      client_key: dhanam
      audience: dhanam-api
      client_id: jnc_uE2zp9ume_Fd6jMl1elL6wqjiECM711t
      description: Dhanam wealth platform — production OIDC confidential client
      is_confidential: true
      website_url: https://app.dhan.am
      redirect_uris:
        - https://app.dhan.am/auth/callback
        - https://admin.dhan.am/auth/callback
        - http://localhost:3000/auth/callback
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  karafiel:
    intake_target: karafiel/web-oidc-janua
    intake_key_map:
      web_oidc_client_id: client_id
      web_janua_secret_key: client_secret
      web_oidc_issuer: issuer
    janua_client:
      name: Karafiel
      client_key: karafiel-app
      audience: karafiel-app
      client_id: jnc_ZDQhZ7jOdqUMIOxHn_zuXvqiMMbWNE0q
      description: Karafiel tenant self-serve app (app.karafiel.mx)
      is_confidential: true
      website_url: https://app.karafiel.mx
      redirect_uris:
        - https://app.karafiel.mx/api/auth/callback
        - http://localhost:3050/api/auth/callback
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  phynd-crm:
    intake_target: phynd-crm/oidc-janua
    janua_client:
      name: Phynd CRM
      client_key: phynd-crm
      audience: phynd-crm-api
      description: Phynd CRM staff SSO (crm.madfam.io)
      is_confidential: true
      website_url: https://crm.madfam.io
      redirect_uris:
        - https://crm.madfam.io/api/auth/callback
        - http://localhost:3000/api/auth/callback
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  ceq:
    intake_target: ceq/janua-client-secret
    intake_key_map:
      JANUA_CLIENT_SECRET: client_secret
    janua_client:
      name: CEQ Studio
      client_key: ceq
      audience: ceq-api
      description: CEQ creative orchestrator studio
      is_confidential: true
      website_url: https://ceq.madfam.io
      redirect_uris:
        - https://ceq.madfam.io/api/auth/callback
        - http://localhost:3000/api/auth/callback
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  lexidrop:
    intake_target: lexidrop/oidc-janua
    # Lowercase Vault properties, because lexidrop's ExternalSecret reads
    # `janua_client_secret` from secret/lexidrop and ESO is all-or-nothing.
    intake_key_map:
      janua_client_id: client_id
      janua_client_secret: client_secret
    janua_client:
      name: LexiDrop
      client_key: lexidrop
      audience: lexidrop
      # Pinned to the client already registered on Janua (confirmed via the
      # by-name endpoint 2026-08-29): the pin makes this RECONCILE, not create a
      # duplicate.
      client_id: jnc_VMg2JHsr8qjmvdhS1ff5qNIRjb0fUA2x
      description: LexiDrop domain-acquisition intelligence (ld-app.madfam.io) — confidential OIDC client for the Janua-gated dashboard
      is_confidential: true
      website_url: https://ld-app.madfam.io
      redirect_uris:
        - https://ld-app.madfam.io/api/auth/callback
        - http://localhost:3000/api/auth/callback
      allowed_scopes:
        - openid
        - profile
        - email
        - offline_access
      grant_types:
        - authorization_code
        - refresh_token

  # ---------------------------------------------------------------------------
  # Nauta → Symbiosis-HCM (service). The ecosystem's FIRST client_credentials
  # machine edge — every entry above is an authorization_code LOGIN client.
  #
  # One edge, one client, one scope (the same rule the Nauta→Karafiel edge
  # follows). A dedicated machine client, NOT the nauta-cockpit login client:
  # granting `hcm:hr` to the credential every MADFAM staffer signs in with would
  # hand payroll authority to that shared login. So this client exists only to
  # let nauta's /recursos-humanos slice mint short-lived HCM tokens.
  #
  # No redirect_uris (client_credentials has no browser leg). It is org-bound to
  # CTM/`crea` (organization_id below): Janua #595 — merged 2026-09-04, in prod
  # 2026-09-07 — emits an org-bound client's app:role scopes verbatim into the
  # roles claim, so a token minted for `hcm:hr` (colon) carries a role HCM's
  # HR_ROLES accepts. Without the org binding that verbatim emission does not
  # fire and HCM answers 403. audience `symbiosis-hcm` is HCM's own audience.
  #
  # NOT pinned with a client_id: this client does not exist yet, so the first
  # provision run CREATES it (reconcile-by-name/key/audience on later runs). Once
  # it is registered, pin its jnc_… id here to make every future run reconcile.
  #
  # intake_target writes the minted pair to Vault secret/nauta as a MERGE, so the
  # two properties land alongside nauta's other keys without clobbering them. The
  # lowercase intake_key_map matches nauta #264's `nauta-hcm-oauth` ExternalSecret
  # (`property: symbiosis_hcm_oauth_client_id` / `_secret`); ESO is all-or-nothing
  # per ExternalSecret, so the case must match exactly or that Secret syncs zero
  # keys and the RH slice stays NOT_CONNECTED.
  # ---------------------------------------------------------------------------
  nauta-symbiosis-hcm:
    intake_target: nauta/symbiosis-hcm-oauth
    intake_key_map:
      symbiosis_hcm_oauth_client_id: client_id
      symbiosis_hcm_oauth_client_secret: client_secret
    janua_client:
      name: Nauta → Symbiosis-HCM (service)
      client_key: nauta-symbiosis-hcm
      audience: symbiosis-hcm
      description: Machine edge (client_credentials) from nauta's /recursos-humanos slice to Symbiosis-HCM. Org-bound to CTM/crea, scope hcm:hr — one edge, one client, one scope. NOT the cockpit login client. Mints short-lived HCM tokens; never a browser login.
      is_confidential: true
      organization_id: e6cbd51d-8329-4c4e-8c74-aba643ab4575
      allowed_scopes:
        - hcm:hr
      grant_types:
        - client_credentials
